name: Deploy to GitHub Pages
# main に入ったときに、テストを通ってから GitHub Pages に公開する。
# 事前にリポジトリの Settings → Pages → Source を「GitHub Actions」にしておく。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: 公開するファイルだけを集める
        run: mkdir _site && cp index.html style.css app.js parse.js sw.js manifest.webmanifest icon.svg _site/ && cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
